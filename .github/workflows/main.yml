name: Build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qrustyquake-windows
          path: build/Release/qrustyquake.exe
          if-no-files-found: error

  windows-xp:
    runs-on: ubuntu-latest
    # -mcrtdll needs MinGW GCC 14; Ubuntu 24.04 ships 13
    container: debian:trixie

    steps:
      - name: Install MinGW-w64
        run: >
          apt-get update && apt-get install -y --no-install-recommends
          gcc-mingw-w64-i686 g++-mingw-w64-i686 cmake make git
          ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B bxp -DCMAKE_TOOLCHAIN_FILE=cmake/winxp-i686-mingw.cmake
          -DCMAKE_BUILD_TYPE=Release -DQRUSTYQUAKE_VENDOR_SDL=ON

      - name: Build
        run: cmake --build bxp --parallel $(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qrustyquake-windows-xp
          path: |
            bxp/qrustyquake.exe
            bxp/SDL3.dll
            bxp/SDL3_mixer.dll
          if-no-files-found: error

  linux-appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppImage
        working-directory: AppImage
        run: ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qrustyquake-linux
          path: AppImage/qrustyquake*.AppImage
          if-no-files-found: error

  linux-appimage-aarch64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppImage
        working-directory: AppImage
        run: ./build.sh linux/arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qrustyquake-linux-aarch64
          path: AppImage/qrustyquake*.AppImage
          if-no-files-found: error

  dos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libfl2
        run: sudo apt-get update && sudo apt-get install -y libfl2

      - name: Build
        run: sh dos/build-dos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qrustyquake-dos
          path: dos/build/dist/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NDK and CMake
        run: >
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Build
        working-directory: android
        run: JAVA_HOME=$JAVA_HOME_17_X64 ./gradlew assembleRelease

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qrustyquake-android
          path: android/build/outputs/apk/release/qrustyquake-release.apk
          if-no-files-found: error
