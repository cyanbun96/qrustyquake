name: Build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qrustyquake-windows
          path: build/Release/qrustyquake.exe
          if-no-files-found: error

  linux-appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppImage
        working-directory: AppImage
        run: ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qrustyquake-linux
          path: AppImage/qrustyquake*.AppImage
          if-no-files-found: error

  linux-appimage-aarch64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppImage
        working-directory: AppImage
        run: ./build.sh linux/arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qrustyquake-linux-aarch64
          path: AppImage/qrustyquake*.AppImage
          if-no-files-found: error

  dos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libfl2
        run: sudo apt-get update && sudo apt-get install -y libfl2

      - name: Build
        run: sh dos/build-dos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qrustyquake-dos
          path: dos/build/dist/
          if-no-files-found: error
