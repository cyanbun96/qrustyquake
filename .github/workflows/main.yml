name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            vendor_sdl: false
            artifact_path: build/Release/qrustyquake.exe
            artifact_name: qrustyquake-windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DQRUSTYQUAKE_VENDOR_SDL=${{ matrix.vendor_sdl }}

      - name: Build
        run: cmake --build build --config Release
        
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
